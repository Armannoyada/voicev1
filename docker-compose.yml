version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: voicev1-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: voicev1
      POSTGRES_PASSWORD: voicev1_dev_password
      POSTGRES_DB: voicev1
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicev1 -d voicev1"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: voicev1-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  livekit:
    image: livekit/livekit-server:latest
    container_name: voicev1-livekit
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    depends_on:
      - redis
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

volumes:
  postgres_data:
